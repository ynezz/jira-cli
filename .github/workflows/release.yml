name: Release

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Run in snapshot mode (no release, just build test)'
        required: false
        default: 'true'
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '^1.24.1'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: ${{ github.event_name == 'workflow_dispatch' && inputs.snapshot && 'release --snapshot --clean' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.snapshot }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
